[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
select = [
    "E",      # Ошибки стиля (pycodestyle)
    "W",      # Предупреждения стиля (pycodestyle)
    "F",      # Ошибки логики (Pyflakes)
    "I",      # Автоматическая сортировка импортов (isort)
    "UP",     # Обновление синтаксиса до новых версий Python
    "B",      # Нахождение вероятных багов (flake8-bugbear)
    "PT",     # Оптимизация тестов Pytest
    "ARG",    # Поиск неиспользуемых аргументов функций
    "D", # Включаем проверку документации (pydocstyle)
    "D213", # Явно приказываем: текст СО ВТОРОЙ строки
]

ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D105",
    "D107",
#    "D200",
    "D203",
    "D212",
]
extend-unsafe-fixes = [
    "D201",
    "D205",
    "D209",
    "D213",
    "D300",
    "D415",
    "D400",
    "D416"
]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false # Важно: Ruff будет сохранять ваши запятые для переносов
docstring-code-format = true      # Форматирует примеры кода в докстрингах

[tool.poetry]
name = "velvet-v2"
version = "0.1.0"
description = ""
authors = ["boradydev"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
alembic = "^1.18.3"
ruff = "^0.14.14"
pyright = "^1.1.408"
sqlalchemy = "^2.0.46"
asyncpg = "^0.31.0"
psycopg2-binary = "^2.9.11"
passlib = "^1.7.4"
pyjwt = "^2.11.0"
fastapi = "^0.128.0"
uvicorn = "^0.40.0"
jinja2 = "^3.1.6"
uuid6 = "^2025.0.1"
python-dotenv = "^1.2.1"
inflection = "^0.5.1"
pydantic = {extras = ["email"], version = "^2.12.5"}
aio-pika = "^9.5.8"
taskiq = "^0.12.1"
taskiq-aio-pika = "^0.5.0"
redis = "^7.1.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "hypothesis (>=6.151.9,<7.0.0)",
    "faker (>=40.5.1,<41.0.0)"
]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = "-ra --cov=src/ --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "integration: тесты, требующие реальную базу данных (Postgres)",
]
